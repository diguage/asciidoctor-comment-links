name: Ruby Compatibility Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby:
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - 'jruby-9.3'
          - 'jruby-9.4'
          - 'jruby-10.0'
          - 'jruby-10.1'
          - 'truffleruby-24'
          - 'truffleruby+graalvm-24'
          - 'truffleruby-25'
          - 'truffleruby+graalvm-25'
        include:
          - os: ubuntu-latest
            ruby: 'truffleruby-24'
            experimental: true
          - os: ubuntu-latest
            ruby: 'truffleruby+graalvm-24'
            experimental: true
          - os: ubuntu-latest
            ruby: 'truffleruby-25'
            experimental: true
          - os: ubuntu-latest
            ruby: 'truffleruby+graalvm-25'
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec

  legacy-test:
    name: Test legacy Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        ruby:
          - 'jruby-9.1'
          - 'jruby-9.2'
          - 'truffleruby-22'
          - 'truffleruby+graalvm-22'
          - 'truffleruby-23'
          - 'truffleruby+graalvm-23'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec
